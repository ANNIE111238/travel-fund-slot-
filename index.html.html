<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0e9">
<title>男友專屬・旅遊基金幸運拉霸</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:linear-gradient(145deg,#fff8f2,#fff0e9 55%,#fce8ee);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#754b50}.machine{width:min(100%,520px);padding:24px;border-radius:26px;background:#fffdfb;box-shadow:0 18px 55px #a66b5b24;text-align:center}.plane{font-size:35px}.eyebrow{font-size:12px;letter-spacing:3px;color:#b77b72;margin-top:6px}.title{font-size:27px;font-weight:850;margin:6px 0}.subtitle{font-size:14px;color:#987b79}.rule{margin:24px 0 12px;display:flex;justify-content:space-between;font-size:13px;color:#987b79}.progress{height:6px;background:#f2e5df;border-radius:9px;overflow:hidden}.progress div{height:100%;width:0;background:#cf8975;transition:width .3s}.reels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:24px 0 15px}.reel small{display:block;font-size:11px;color:#987b79;margin-top:10px}.digit{height:clamp(75px,19vw,108px);display:grid;place-items:center;border-radius:15px;background:linear-gradient(#fff,#fff7f1);border:2px solid #efd5ca;box-shadow:0 5px 0 #e5c6b8;font-size:clamp(38px,10vw,60px);font-weight:850;color:#bd6b63;font-variant-numeric:tabular-nums}.digit.done{background:linear-gradient(145deg,#fff0d5,#ffe2dc);border-color:#dfaa87;color:#a94e4e}.digit.spin{animation:pulse .09s linear infinite alternate}@keyframes pulse{to{transform:translateY(2px);filter:blur(1px)}}.hint{min-height:22px;font-size:13px;color:#987b79;margin:18px 0}.action{width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:750;background:#bc7068;color:white;box-shadow:0 4px 0 #94504d;cursor:pointer}.action:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.result{margin-top:20px;padding:18px;border:1px solid #f0ded5;border-radius:18px;background:#fff9f4}.amount{font-size:clamp(38px,10vw,52px);font-weight:850;letter-spacing:4px;color:#c27860}.secondary{margin-top:18px;border:1px solid #eadbd5;border-radius:12px;padding:10px 18px;background:white;color:#987b79;cursor:pointer}.foot{font-size:11px;color:#b39a95;margin-top:18px}
</style></head>
<body><main class="machine"><div class="plane">✈️ 💗 🌴</div><div class="eyebrow">A LITTLE SURPRISE FOR YOU</div><h1 class="title">TRAVEL FUND</h1><div class="subtitle">男友專屬・旅遊基金幸運拉霸</div><div class="subtitle" style="margin-top:12px">今天的旅遊基金，就靠你的手氣了！</div>
<div class="rule"><b>🎰 幸運數字抽選</b><span id="step">0 / 4 已抽出</span></div><div class="progress"><div id="bar"></div></div>
<div class="reels"><div><div class="digit" id="d0">?</div><small>第 1 碼・0–1</small></div><div><div class="digit" id="d1">?</div><small>第 2 碼・0–9</small></div><div><div class="digit" id="d2">?</div><small>第 3 碼・0–9</small></div><div><div class="digit" id="d3">?</div><small>第 4 碼・0–9</small></div></div>
<div class="hint" id="hint">準備好了嗎？按下按鈕，抽出第一個幸運數字！</div><button class="action" id="spin">🎲 抽出第一個數字！</button>
<section class="result" id="result" hidden><div style="font-size:25px">🎉 💕 🎉</div><div class="subtitle" style="margin-top:8px">恭喜獲得本次旅遊基金</div><div class="amount" id="final">0000</div><b>新台幣・旅遊基金</b><div class="subtitle" style="margin-top:12px">這趟旅行，要玩得開心喔！✈️</div></section>
<button class="secondary" id="reset">↻ 重新開始抽獎</button><div class="foot">每個數字依序抽出，四碼全部揭曉才會知道最終金額。</div></main>
<script>
(()=>{const digits=[0,0,0,0],els=[0,1,2,3].map(i=>document.getElementById('d'+i)),spin=document.getElementById('spin'),hint=document.getElementById('hint'),step=document.getElementById('step'),bar=document.getElementById('bar'),result=document.getElementById('result');let count=0,busy=false;const labels=['第一個數字','第二個數字','第三個數字','第四個數字'];function update(){step.textContent=count+' / 4 已抽出';bar.style.width=count*25+'%';if(count===4){document.getElementById('final').textContent=digits.join('');result.hidden=false;spin.textContent='🎉 抽獎完成！';spin.disabled=true;hint.textContent='恭喜！你的旅遊基金已經揭曉！'}else{spin.textContent='🎰 抽出'+labels[count]+'！';spin.disabled=false}}spin.addEventListener('click',()=>{if(busy||count>=4)return;busy=true;let i=count,limit=i===0?2:10;spin.disabled=true;hint.textContent='✨ 正在抽出'+labels[i]+'……';els[i].classList.add('spin');let ticks=0,timer=setInterval(()=>{els[i].textContent=Math.floor(Math.random()*limit);if(++ticks>=13){clearInterval(timer);digits[i]=Math.floor(Math.random()*limit);els[i].textContent=digits[i];els[i].classList.remove('spin');els[i].classList.add('done');count++;busy=false;update();if(count<4)hint.textContent='💗 太好了！接著抽出'+labels[count]+'吧！'}},95)});document.getElementById('reset').addEventListener('click',()=>{if(busy)return;count=0;digits.fill(0);els.forEach(e=>{e.textContent='?';e.classList.remove('done','spin')});result.hidden=true;hint.textContent='準備好了嗎？按下按鈕，抽出第一個幸運數字！';update()});update()})();
</script></body></html>
